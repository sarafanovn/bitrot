[package]
name = "bitrot"
version = "0.2.0"
edition = "2024"
description = "A small macOS image editor for digital decay effects: disintegration, pixelation, pixel sorting and glitch, applied through soft masks."
license = "MIT"
repository = "https://github.com/niksanhts/bitrot"

[dependencies]
eframe = "0.36.2"
image = "0.25.10"
rayon = "1.12.0"
rfd = "0.17.2"

# Image processing is unusably slow without optimisation, even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
